<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '25rem' }">
  <ng-template #header>
    <div class="inline-flex items-center justify-center gap-2">
      <span class="font-bold whitespace-nowrap">{{ config?.title }}</span>
    </div>
  </ng-template>
  <span class="text-surface-500 dark:text-surface-400 block mb-8 text-sm"
    >{{ config?.message }}</span
  >
  <!-- <div class="flex items-center gap-4 mb-4">
    <label for="username" class="font-semibold w-24 text-sm">{{ config?.confirmButtonText }}</label>
    <input pInputText id="username" class="flex-auto" autocomplete="off" />
  </div> -->
  <ng-template #footer>
    <p-button
      type="button"
      label="{{ config?.cancelButtonText }}"
      severity="danger"
      (click)="onCancel()"
    >
    </p-button>
    <p-button
      type="button"
      label="{{ config?.confirmButtonText }}"
      severity="primary"
      (click)="onConfirm()"
    >
    </p-button>
  </ng-template>
</p-dialog>
