        <img src="/assets/images/logo.png" alt="logo" class="w-14 h-14">
        <span class="text-white text-2xl font-bold">Dev Atlas</span>
    </div>

    <div class="flex justify-center items-center w-full px-4">
        <button class="bg-accent text-white text-sm px-4 py-2 rounded-md w-full hover:bg-accent/80 transition-all duration-300 cursor-pointer" (click)="onCreateTopic()">
            Crear nuevo topic
        </button>
    </div>

    <!-- SEPARADOR -->
    <div class="border-b border-line my-4 mx-4"></div>

    <!-- LISTA DE TOPICS -->
    <div class="flex flex-col p-4">

    </div>
</div>
