<div
  class="flex flex-col justify-center items-center h-full w-full bg-panel rounded-md"
>
  <h1 class="text-text font-bold text-2xl">No hay topics</h1>
  <p class="text-text text-sm">
    No hay topics disponibles, crea uno para empezar
  </p>
  <p-button type="button"
    class="bg-primary text-white px-4 py-2 rounded-md font-bold"
    label="Crear nuevo topic"
    (click)="onCreateTopic()"
    icon="pi pi-plus"
  />
</div>
