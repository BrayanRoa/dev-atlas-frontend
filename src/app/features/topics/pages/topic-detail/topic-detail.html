<div
  class="flex justify-center items-center h-full w-full bg-panel border-2 border-line rounded-md p-4"
>
  @if (!topicDetail) {
  <div class="flex justify-center items-center h-full w-full">
    <span>No hay topic seleccionado</span>
  </div>
  } @else {
  <div class="flex flex-col gap-4 h-full w-full">
    <!-- ENCABEZADO -->
    <div
      class="flex justify-between items-center border-b-2 border-line rounded-md pb-2"
    >
      <div class="col-span-10 flex gap-4">
        <!-- IMAGEN DEL TOPIC -->
        <div class="w-20 h-20 bg-main rounded-md border-2 border-line p-2">
          <img
            [src]="getIconPath(topicDetail.icon)"
            alt="Imagen del topic"
            class="w-full h-full object-cover rounded-md"
          />
        </div>

        <!-- TITULO DEL TOPIC E INFORMACION GENERAL -->
        <div class="flex flex-col">
          <h1 class="text-text font-bold text-2xl">
            {{ topicDetail.title | titlecase }}
          </h1>
          <p class="text-text text-sm">
            {{ topicDetail.description | titlecase }}
          </p>

          <div class="flex gap-2">
            @for (tag of topicDetail.topicTags; track $index) {
            <span
              class="text-text text-sm rounded-md px-2 py-1 border border-line"
              [class]="tag.tag.color"
              >{{ tag.tag.name | titlecase }}</span
            >
            }
          </div>
        </div>
      </div>

      <!-- ACCIONES DEL TOPIC -->
      <div class="col-span-2 flex gap-2">
        <p-menu #menu [model]="items" [popup]="true">
          <ng-template #item let-item>
            <a pRipple class="flex items-center px-2.5 py-1.5 cursor-pointer">
              <i class="pi pi-{{ item.icon }}"></i>
              <span class="ms-2 text-sm">{{ item.label }}</span>
            </a>
          </ng-template>
        </p-menu>
        <button
          type="button"
          pButton
          severity="secondary"
          [outlined]="true"
          iconOnly
          aria-label="Apps"
          (click)="menu.toggle($event)"
        >
          <i class="pi pi-ellipsis-v"></i>
        </button>
      </div>
    </div>

    <!-- CONTENIDO PRICIPAL -->
    <div class="flex gap-4 h-full w-full">
      <!-- CONTENIDO PRINCIPAL -->
      <div class="flex-1 h-full w-full gap-4">
        <app-topic-content-component [subtopic]="selectedSubtopic" />
      </div>


      <!-- BARRA LATERAL -->
      <div
        class="w-sidebar h-full bg-main p-4 border-2 border-line rounded-md overflow-y-auto"
      >
        <app-subtopics-menu [subtopicsList]="subtopics" (selectedSubtopic)="onSelectSubtopic($event)" />
      </div>
    </div>
  </div>

  }
</div>

<app-modal-confirm-component
  [visible]="visibleModalConfirmation"
  [config]="modalConfirmationConfig"
  (confirm)="onConfirmDeleteTopic()"
  (cancel)="onCancelDeleteTopic()"
/>
