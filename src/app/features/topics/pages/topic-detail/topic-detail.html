<div
  class="flex h-full min-h-0 w-full flex-col bg-panel border-2 border-line rounded-md p-4"
>
  @if (!topicDetail) {
  <div class="flex h-full w-full items-center justify-center">
    <span>No hay topic seleccionado</span>
  </div>
  } @else {
  <div class="flex h-full min-h-0 w-full flex-col gap-4">
    <!-- ENCABEZADO DEL TOPIC -->
    <div
      class="flex shrink-0 items-center justify-between rounded-md border-b-2 border-line pb-2"
    >
      <div class="flex gap-4">
        <div class="h-20 w-20 shrink-0 rounded-md border-2 border-line bg-main p-2">
          <img
            [src]="getIconPath(topicDetail.icon)"
            alt="Imagen del topic"
            class="h-full w-full rounded-md object-cover"
          />
        </div>

        <div class="flex flex-col gap-1">
          <!-- breadcrumb -->
          <div class="flex items-center gap-2">
            <h1 class="m-0 text-xl font-bold text-text">
              {{ topicDetail.title | titlecase }}
            </h1>
            <i class="pi pi-angle-right"></i>
            <p class="m-0 text-xl font-bold text-text">
              {{ selectedSubtopic?.title | titlecase }}
            </p>
          </div>

          <!-- descripción del topic principal -->
          <p class="m-0 text-sm text-text">
            {{ topicDetail.description | titlecase }}
          </p>

          <!-- tags del subtopic seleccionado -->
          <!-- @if (selectedSubtopic?.topicTags?.length) { -->
          <div class="flex flex-wrap gap-2">
            @for (topicTag of joinTags(); track $index) {
            <span
              class="rounded-md border border-line px-2 py-1 text-xs font-bold text-text"
              [class]="topicTag.color"
              >{{ topicTag.name | titlecase }}</span
            >
            }
          </div>
          <!-- } -->
        </div>
      </div>

      <div class="flex gap-2">
        <p-menu #menu [model]="items" [popup]="true">
          <ng-template #item let-item>
            <a pRipple class="flex cursor-pointer items-center px-2.5 py-1.5">
              <i class="pi pi-{{ item.icon }}"></i>
              <span class="ms-2 text-sm">{{ item.label }}</span>
            </a>
          </ng-template>
        </p-menu>
        <button
          type="button"
          pButton
          severity="secondary"
          [outlined]="true"
          iconOnly
          aria-label="Apps"
          (click)="menu.toggle($event)"
        >
          <i class="pi pi-ellipsis-v"></i>
        </button>
      </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex min-h-0 flex-1 gap-4">
      <div class="flex min-h-0 min-w-0 flex-1 flex-col">
        <app-topic-content-component
          class="block h-full min-h-0"
          [subtopic]="selectedSubtopic"
        />
      </div>

      <div
        class="h-full w-sidebar shrink-0 overflow-y-auto rounded-md border-2 border-line bg-main p-4"
      >
        <app-subtopics-menu
          [subtopicsList]="subtopics"
          (selectedSubtopic)="onSelectSubtopic($event)"
          (deletedSubtopic)="onDeletedSubtopic($event)"
        />
      </div>
    </div>
  </div>
  }
</div>

<app-modal-confirm-component
  [visible]="visibleModalConfirmation"
  [config]="modalConfirmationConfig"
  (confirm)="onConfirmDeleteTopic()"
  (cancel)="onCancelDeleteTopic()"
/>
