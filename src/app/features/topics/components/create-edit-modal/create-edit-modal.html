<p-dialog
  [header]="topicDialogService.title()"
  [modal]="true"
  appendTo="body"
  draggable="false"
  [visible]="topicDialogService.open()"
  (visibleChange)="onDialogVisibleChange($event)"
  [style]="{ width: '500px' }"
>
  <!-- header -->
  <ng-template #header>
    <div class="inline-flex items-center justify-center gap-2">
      <span class="font-bold whitespace-nowrap text-text"
        >{{ topicDialogService.title() }}</span
      >
    </div>
  </ng-template>

  <!-- body - formulario -->
   <form [formGroup]="form" (ngSubmit)="onSubmit()">

     <div class="flex flex-col gap-4">
       <p-iftalabel>
      <input
        type="text"
        id="name"
        formControlName="name"
        pInputText
        [fluid]="true"
      />
      <label for="name">Nombre</label>
    </p-iftalabel>

    <p-iftalabel>
      <input
        type="text"
        id="description"
        formControlName="description"
        pInputText
        [fluid]="true"
      />
      <label for="description">Description</label>
    </p-iftalabel>

    <p-iftalabel>
      <p-select
        inputId="icon"
        appendTo="body"
        fluid="true"
        [options]="icons"
        formControlName="icon"
        optionLabel="name"
        [filter]="true"
        filterBy="name"
        [showClear]="true"
        placeholder="Selecciona un icono"
      >
        <ng-template #selectedItem let-selectedOption>
          <div class="flex items-center gap-2">
            <img
              [src]="'/assets/images/' + selectedOption.icon"
              [alt]="selectedOption.name"
              class="h-4 w-4"
            />
            <div>{{ selectedOption.name }}</div>
          </div>
        </ng-template>
        <ng-template #item let-icon>
          <div class="flex items-center gap-2">
            <img
              [src]="'/assets/images/' + icon.icon"
              [alt]="icon.name"
              class="h-4 w-4"
            />
            <div>{{ icon.name }}</div>
          </div>
        </ng-template>
      </p-select>
      <label for="icon">Icono</label>
    </p-iftalabel>

    <p-iftalabel>
      <p-multiselect
        inputId="tags"
        appendTo="body"
        [fluid]="true"
        formControlName="tags"
        optionLabel="label"
        optionValue="value"
        filterBy="label"
        [filter]="true"
        [options]="tags"
        [showClear]="true"
        placeholder="Selecciona tags"
        display="chip"
      >
        <ng-template #item let-tag>
          <div class="flex items-center gap-2">
            <div class="h-2 w-2 rounded-full" [ngClass]="tag.color"></div>
            <div>{{ tag.label }}</div>
          </div>
        </ng-template>
        <ng-template #selecteditems let-selected>
          <div class="flex flex-wrap gap-2">
            @for (tag of selected; track tag.value) {
              <span class="inline-flex items-center gap-2 rounded-md px-2 py-1 text-white" [ngClass]="tag.color">
                {{ tag.label }}
              </span>
            }
          </div>
        </ng-template>
      </p-multiselect>
      <label for="tags">Tags</label>
    </p-iftalabel>
  </div>
</form>

<ng-template #footer>
  <div class="flex justify-end gap-2">
    <p-button 
      type="submit" 
      label="Guardar"
      icon="pi pi-save"
      [disabled]="form.invalid"
      (click)="onSubmit()">
    </p-button>
    <p-button 
      type="button" 
      label="Cancelar"
      icon="pi pi-times"
      severity="danger"
      (click)="onCancel()">
    </p-button>
  </div>
</ng-template>
  
  <!-- footer -->
</p-dialog>

<!-- TOAST -->
<p-toast />
