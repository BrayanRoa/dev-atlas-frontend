<p-dialog
  [header]="topicDialogService.title()"
  [modal]="true"
  appendTo="body"
  draggable="false"
  [visible]="topicDialogService.open()"
  (visibleChange)="topicDialogService.close()"
  styleClass=" !bg-main border-none"
  [style]="{ width: '500px' }"
>
  <!-- header -->
  <ng-template #header>
    <div class="inline-flex items-center justify-center gap-2">
      <span class="font-bold whitespace-nowrap text-text"
        >{{ topicDialogService.title() }}</span
      >
    </div>
  </ng-template>

  <!-- body - formulario -->
   <form [formGroup]="form" (ngSubmit)="onSubmit()">

     <div class="flex flex-col gap-4">
       <div class="flex flex-col gap-1 w-full">
      <label for="name" class="text-sm font-medium text-text">Name</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full p-2 border border-gray-300 rounded-md text-text"
      />
    </div>
    
    <div class="flex flex-col gap-1 w-full">
      <label for="description" class="text-sm font-medium text-text"
        >Description</label
      >
      <input
        type="text"
        id="description"
        formControlName="description"
        class="w-full p-2 border border-gray-300 rounded-md text-text"
      />
    </div>
    
    <div class="flex flex-col gap-1 w-full">
      <label for="icon" class="text-sm font-medium text-text">Icono</label>
      <p-select
        inputId="icon"
        appendTo="body"
        fluid="true"
        [options]="icons"
        formControlName="icon"
        optionLabel="name"
        [filter]="true"
        filterBy="name"
        [showClear]="true"
        placeholder="Selecciona un icono"
        class="w-full !bg-main"
      >
        <ng-template #selectedItem let-selectedOption>
          <div class="flex items-center gap-2">
            <img
              [src]="'/assets/images/' + selectedOption.icon"
              [alt]="selectedOption.name"
              class="h-4 w-4"
            />
            <div class="text-text">{{ selectedOption.name }}</div>
          </div>
        </ng-template>
        <ng-template #item let-icon>
          <div class="flex items-center gap-2">
            <img
              [src]="'/assets/images/' + icon.icon"
              [alt]="icon.name"
              class="h-4 w-4"
            />
            <div>{{ icon.name }}</div>
          </div>
        </ng-template>
      </p-select>
    </div>

    <div class="flex flex-col gap-1 w-full">
      <label for="tags" class="text-sm font-medium text-text">Tags</label>
      <p-select
        inputId="tags"
        appendTo="body"
        fluid="true"
        [options]="tags"
        formControlName="tags"
        optionLabel="name"
        [filter]="true"
        filterBy="name"
        [showClear]="true"
        placeholder="Selecciona un tag"
        class="w-full !bg-main"
      >
        <ng-template #selectedItem let-selectedOption>
          <div class="text-text">{{ selectedOption.name }}</div>
        </ng-template>
        <ng-template #item let-tag>
          <div>{{ tag.name }}</div>
        </ng-template>
      </p-select>
    </div>
  </div>
</form>

<ng-template #footer>
  <div class="flex justify-end gap-2">
    <button 
      type="submit" 
      class="bg-line text-text px-4 py-2 rounded-md" 
      [disabled]="form.invalid"
      (click)="onSubmit()">
      Guardar
    </button>
    <button 
      type="button" 
      class="bg-line text-text px-4 py-2 rounded-md"
      (click)="onCancel()">
      Cancelar
    </button>
  </div>
</ng-template>
  
  <!-- footer -->
</p-dialog>
