<div class="flex h-full min-h-0 w-full flex-col gap-3">
  @if (subtopic) { @if (!isEditing) {
  <p-button
    type="button"
    label="Editar"
    icon="pi pi-pencil"
    (onClick)="onEdit()"
  />
  <markdown [data]="subtopic.content" [disableSanitizer]="true"> </markdown>
  }@else {
  <div
    class="topic-markdown-editor flex min-h-0 flex-1 flex-col overflow-hidden rounded-md border-2 border-line"
  >
    <div #editorHost class="h-full min-h-0"></div>
  </div>
  } }
</div>
