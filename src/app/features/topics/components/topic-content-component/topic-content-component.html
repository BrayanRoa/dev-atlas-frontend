<div class="flex h-full min-h-0 w-full flex-col gap-2">
  <div class="flex shrink-0 items-center justify-end gap-1">
    @if (!isEditing && subtopic) {
    <p-button icon="pi pi-pencil" [text]="true" (onClick)="onEdit()" />
    } @else if (subtopic && isEditing) {
    <p-button icon="pi pi-save" [text]="true" (onClick)="onSave()" />
    <p-button icon="pi pi-times" [text]="true" (onClick)="onCancelEdit()" />
    }
  </div>

  @if (subtopic && !isEditing) {
  <div class="topic-markdown-view min-h-0 flex-1 overflow-y-auto px-1">
    <markdown
      class="prose prose-invert max-w-none"
      [data]="subtopic.content"
      [disableSanitizer]="true"
    ></markdown>
  </div>
  } @else if (subtopic && isEditing) {
  <div
    class="topic-markdown-editor flex min-h-0 flex-1 flex-col overflow-hidden rounded-md border-2 border-line"
  >
    <div #editorHost class="h-full min-h-0"></div>
  </div>
  }
</div>
