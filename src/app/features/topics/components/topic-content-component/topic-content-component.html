<div class="flex h-full min-h-0 w-full flex-col gap-2">
  <!-- Barra de acciones del contenido -->
  <div
    class="flex shrink-0 items-center gap-1"
    [class]="fullScreenMode ? 'justify-between' : 'justify-end'"
  >
    <!-- Título corto solo en modo focus -->
    @if (fullScreenMode) {
    <span class="truncate text-sm font-bold text-text">{{
      subtopic?.title
    }}</span>
    }

    <div class="flex items-center gap-1">
      <!-- Entrar / salir de modo focus -->
      <p-button
        [icon]="
          fullScreenMode
            ? 'pi pi-arrow-down-left-and-arrow-up-right-to-center'
            : 'pi pi-arrow-up-right-and-arrow-down-left-from-center'
        "
        [text]="true"
        [pTooltip]="fullScreenMode ? 'Salir de pantalla completa' : 'Pantalla completa'"
        (onClick)="onToggleFullScreen()"
      />

      <!-- Importar .md (solo en edición) -->
      @if (subtopic && isEditing) {
      <input
        #fileInput
        type="file"
        class="hidden"
        accept=".md,text/markdown"
        (change)="onFileSelected($event)"
      />
      <p-button
        icon="pi pi-upload"
        [text]="true"
        pTooltip="Cargar archivo Markdown"
        (onClick)="fileInput.click()"
      />
      }

      <!-- Entrar a edición -->
      @if (!isEditing && subtopic) {
      <p-button
        icon="pi pi-pencil"
        [text]="true"
        pTooltip="Editar contenido"
        (onClick)="onEdit()"
      />
      }

      <!-- Guardar cambios -->
      @if (subtopic && isEditing) {
      <p-button
        icon="pi pi-save"
        [text]="true"
        pTooltip="Guardar contenido"
        (onClick)="onSave()"
      />
      <!-- Cancelar edición -->
      <p-button
        icon="pi pi-times"
        [text]="true"
        pTooltip="Cancelar edición"
        (onClick)="onCancelEdit()"
      />
      }
    </div>
  </div>

  <!-- Vista de lectura -->
  @if (subtopic && !isEditing) {
  <div class="topic-markdown-view min-h-0 flex-1 overflow-y-auto px-1">
    @if (subtopic.content === '') {
    <div
      class="flex h-full items-center justify-center text-center text-gray-500"
    >
      No hay contenido para este topic
    </div>
    }

    <markdown
      class="prose prose-invert max-w-none"
      [data]="subtopic.content"
      [disableSanitizer]="true"
    ></markdown>
  </div>
  }

  <!-- Editor markdown -->
  @else if (subtopic && isEditing) {
  <div
    class="topic-markdown-editor flex min-h-0 flex-1 flex-col overflow-hidden rounded-md border-2 border-line"
  >
    <div #editorHost class="h-full min-h-0"></div>
  </div>
  }

  <p-toast />
</div>

<p-confirmdialog />
