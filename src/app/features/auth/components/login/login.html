<div class="flex min-h-screen w-full flex-col bg-main p-6">
  <div class="m-auto w-full max-w-md rounded-lg border-2 border-gray-600 bg-panel px-6 py-8">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-white">Bienvenido de nuevo</h1>
      <p class="mt-1 text-sm text-gray-300">Accede a tu biblioteca de conocimiento.</p>
    </div>

    <form class="mt-6 flex flex-col gap-4" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-bold text-white" for="email">Correo electrónico</label>
        <input id="email" type="email" pInputText [fluid]="true" formControlName="email" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-bold text-white" for="password">Contraseña</label>
        <input id="password" type="password" pInputText [fluid]="true" formControlName="password" />
      </div>

      <p-button 
        label="Iniciar sesión" 
        icon="pi pi-sign-in" 
        type="submit"
        [loading]="loading" 
        styleClass="mt-2 w-full cursor-pointer rounded-md border !border-neutral-200 !bg-line px-4 py-2 text-white" />

      <!-- <button 
        class="relative mt-2 w-full cursor-pointer rounded-md border border-neutral-200 bg-line px-4 py-2 text-white" 
        type="submit">
        @if(loading){
          <p-progressSpinner mode="indeterminate" [style]="{ width: '30px', height: '30px' }" />
        }
        @else{
          Iniciar sesión
        }
      </button> -->
    </form>

    <p class="mt-6 text-center text-sm text-white">
      ¿No tienes una cuenta?
      <a href="/auth/register" class="text-blue-500">Regístrate</a>
    </p>
  </div>
</div>
