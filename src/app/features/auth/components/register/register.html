<div class="flex min-h-screen w-full flex-col bg-main p-6">
  <div class="m-auto w-full max-w-md rounded-lg border-2 border-gray-600 bg-panel px-6 py-8">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-white">Regístrate</h1>
      <p class="mt-1 text-sm text-gray-300">Crea una cuenta para acceder a tu biblioteca de conocimiento.</p>
    </div>

    <form class="mt-6 flex flex-col gap-4" [formGroup]="registerForm" (ngSubmit)="register()">
      <p-iftalabel>
        <input id="firstName" type="text" pInputText [fluid]="true" formControlName="firstName" />
        <label for="firstName">Nombre</label>
      </p-iftalabel>

      <p-iftalabel>
        <input id="lastName" type="text" pInputText [fluid]="true" formControlName="lastName" />
        <label for="lastName">Apellido</label>
      </p-iftalabel>

      <p-iftalabel>
        <input id="email" type="email" pInputText [fluid]="true" formControlName="email" />
        <label for="email">Correo electrónico</label>
      </p-iftalabel>

      <p-iftalabel>
        <input id="password" type="password" pInputText [fluid]="true" formControlName="password" />
        <label for="password">Contraseña</label>
      </p-iftalabel>

      <p-button 
        label="Registrarse" 
        icon="pi pi-sign-in" 
        type="submit"
        [loading]="loading"
        [disabled]="registerForm.invalid" 
        styleClass="mt-2 w-full" />
    </form>

    <p class="mt-6 text-center text-sm text-white">
      ¿Ya tienes una cuenta?
      <a href="/auth/login" class="text-blue-500">Inicia sesión</a>
    </p>
  </div>
</div>
<p-toast />
