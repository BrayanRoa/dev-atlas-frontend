<p-dialog [visible]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true" [style]="{ width: '25rem' }">
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <span class="font-bold whitespace-nowrap">Crear nuevo workspace</span>
      </div>
    </ng-template>
  
    <ng-template #content>
      <form action="" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-4">
          <p-iftalabel>
            <input
              type="text"
              id="name"
              formControlName="name"
              pInputText
              [fluid]="true"
            />
            <label for="name">Nombre</label>
          </p-iftalabel>
        </div>
      </form>
    </ng-template>
  
    <ng-template #footer>
      <div class="flex justify-end gap-2">
        <p-button
          type="submit"
          label="Guardar"
          icon="pi pi-save"
          (click)="onSubmit()"
          [disabled]="form.invalid"
        >
        </p-button>
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="danger"
          (click)="onCancel()"
        >
        </p-button>
      </div>
    </ng-template>
  </p-dialog>
