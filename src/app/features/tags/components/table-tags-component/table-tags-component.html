<p-table [value]="tableTags" size="small">
  <ng-template #header>
    <tr>
      <th>Workspace</th>
      <th>Tag</th>
      <th>Color</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-tag>
    <tr>
      <td>{{ tag.workspace }}</td>
      <td>{{ tag.name }}</td>
      <td>
        <div [class]="tag.color" class="w-8 h-8 rounded-full"></div>
      </td>
      <td class="flex items-center justify-center gap-2">
        <p-button icon="pi pi-pencil" severity="info" (onClick)="onEditTag(tag)" />
        <p-button icon="pi pi-trash" severity="danger" (onClick)="onDeleteTag(tag)" />
      </td>
    </tr>
  </ng-template>
</p-table>
