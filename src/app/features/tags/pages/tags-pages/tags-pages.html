<div class="flex flex-col gap-4">
  
  <div class="grid grid-cols-12 w-full justify-between items-center gap-4 rounded-md bg-panel p-4">
    <div class="col-span-1 flex justify-center items-center">
      <img src="assets/icons/tag.svg" alt="tags" class="w-10 h-10 text-text">
    </div>

    <div class="col-span-8">
      <span class="text-lg font-bold text-text">Tags</span>
      <p class="text-sm text-text">
        Gestiona tus etiquetas de manera sencilla y organizada.
      </p>
    </div>
    <div class="col-span-3 flex justify-end">
      <p-button label="Agregar tag" icon="pi pi-plus" (click)="openModal()" />
    </div>
  
  </div>
  
  <div class="flex flex-col gap-4 bg-panel p-4 rounded-md">
    <app-table-tags-component 
      [workspaces]="allWorkspacesWithTags()" 
      (onEditTagEvent)="onEditTag($event)"
      (onDeleteTagEvent)="onDeleteTag($event)"
    />
  </div>

</div>

<app-create-edit-tag-component
  [(visible)]="visibleModal"
  [tag]="tagToEdit"
  [action]="action"
  (onSubmitEvent)="onCreateOrUpdateTag($event)"
/>

<p-toast />
